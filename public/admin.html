<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rifa Certa Admin</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">🍀 <strong>Rifa Certa</strong> <small>ADMIN</small></div><div><a href="/" style="color:#b6f43e">Cliente</a> <button id="logout" class="secondary" style="display:none;margin-left:10px">Sair</button></div></header>
<main>
<section id="loginBox" class="panel" style="max-width:460px;margin:50px auto">
<span class="badge">ÁREA RESTRITA</span><h1 style="font-size:32px">Entrar no painel</h1>
<form id="loginForm"><label>Usuário<input name="user" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Entrar</button></form><div id="loginMsg" class="msg"></div>
</section>
<div id="adminApp" style="display:none">
<section class="hero"><div><span class="badge">PAINEL ADMINISTRATIVO</span><h1>Gerenciar campanhas</h1><p>Crie, pause e acompanhe suas campanhas.</p></div></section>
<section class="layout"><div class="panel"><h2>Criar campanha</h2><form id="form">
<label>Nome da campanha<input name="title" required></label><label>Prêmio<input name="prize" required></label>
<label>Tipo<select name="type"><option value="numeros">Números</option><option value="dezena">Dezena</option><option value="centena">Centena</option><option value="grupo">Grupo</option></select></label><label>Data
<input name="date" type="date" required>
</label>
<label>Horário
<input name="time" type="time" required>
</label>
<label>Até qual posição vale?
<select name="maxPrizePosition" required>
<option value="1">Só 1º prêmio</option>
<option value="2">1º e 2º</option>
<option value="3">1º ao 3º</option>
<option value="4">1º ao 4º</option>
<option value="5">1º ao 5º</option>
</select>
</label>

<label>1º prêmio R$
<input name="prize1" type="number" min="0" step="0.01">
</label>

<label>2º prêmio R$
<input name="prize2" type="number" min="0" step="0.01">
</label>

<label>3º prêmio R$
<input name="prize3" type="number" min="0" step="0.01">
</label>

<label>4º prêmio R$
<input name="prize4" type="number" min="0" step="0.01">
</label>

<label>5º prêmio R$
<input name="prize5" type="number" min="0" step="0.01">
</label>
<label>Foto do prêmio<input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label>
<label>Valor por número<input name="price" type="number" min="0.01" step="0.01" required></label><label>Quantidade<input name="totalTickets" type="number" min="1" max="10000" required></label>
<button class="primary">Criar campanha</button></form><div id="msg" class="msg"></div></div>
<aside class="cart"><h2>Campanhas</h2><div id="campaigns"></div>
</aside><aside class="cart">
<div class="panel">
  <h2>Resultados</h2>
<label>Data
<input id="resultDate" type="date">
</label>
  <label>Horário
    <input id="resultTime" type="time">
  </label>

  <label>1º resultado
    <input id="result1" placeholder="Ex: 1234">
  </label>

  <label>2º resultado
    <input id="result2" placeholder="Ex: 5678">
  </label>

  <label>3º resultado
    <input id="result3" placeholder="Ex: 9012">
  </label>

  <label>4º resultado
    <input id="result4" placeholder="Ex: 3456">
  </label>

  <label>5º resultado
    <input id="result5" placeholder="Ex: 7890">
  </label>

  <button id="saveResults" class="primary">Salvar e conferir resultados</button>

  <div id="resultMessage" class="msg"></div>
</div>

<h2>Venda manual</h2>

<form id="manualSaleForm">
<label>Rifa
<select id="manualCampaign" required></select>
</label>

<label>Nome do cliente
<input id="manualName" required>
</label>

<label>WhatsApp
<input id="manualPhone">
</label>

<label>Número / Grupo / Dezena / Centena
<input id="manualNumber" required>
</label>

<label>Forma de pagamento
<select id="manualPayment">
<option value="dinheiro">Dinheiro</option>
<option value="pix">PIX</option>
</select>
</label>

<button class="primary" type="submit">Marcar PAGO / VENDIDO</button>
</form>

<div id="manualMsg" class="msg"></div>
</aside><aside class="cart"><h2>Pagamentos</h2><div id="payments"></div></aside></section></div></main><script>
let token=localStorage.getItem('rc_admin_token')||'';
const auth=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});
async function check(){if(!token)return showLogin();const r=await fetch('/api/admin/me',{headers:auth()});if(!r.ok){token='';localStorage.removeItem('rc_admin_token');return showLogin();}loginBox.style.display='none';adminApp.style.display='block';logout.style.display='inline-block';refresh();}
function showLogin(){loginBox.style.display='block';adminApp.style.display='none';logout.style.display='none';}
loginForm.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(loginForm));const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});const d=await r.json();if(!r.ok)return loginMsg.textContent=d.error;token=d.token;localStorage.setItem('rc_admin_token',token);loginMsg.textContent='';check();};
logout.onclick=async()=>{await fetch('/api/admin/logout',{method:'POST',headers:auth()});token='';localStorage.removeItem('rc_admin_token');showLogin();};
const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function refresh(){const cs=await fetch('/api/admin/campaigns',{headers:auth()}).then(r=>r.json());manualCampaign.innerHTML=cs.map(c=>'<option value="'+c.id+'">'+c.title+'</option>').join('');


=cs.map(c=>`<div class="admin-card"><strong>${c.title}</strong><br><span>${c.type} • ${c.sold.length}/${c.totalTickets} vendidos • ${c.status}</span><br><b>${money(c.price)}</b><div style="margin-top:8px"><button class="secondary" onclick="statusChange('${c.id}','${c.status==='ativa'?'pausada':'ativa'}')">${c.status==='ativa'?'Pausar':'Ativar'}</button> <button class="secondary" onclick="statusChange('${c.id}','encerrada')">Encerrar</button></div></div>`).join('');
const ps=await fetch('/api/admin/payments',{headers:auth()}).then(r=>r.json());



document.getElementById('payments').innerHTML=ps.length?ps.map(p=>'<div class="admin-card"><strong>'+money(p.amount)+'</strong><br>Status: '+(p.status==='processed'?'PAGO':(p.status||'-'))+'<br>Números: '+(p.numbers||[]).join(', ')+'<br>Nome: '+(p.name||'-')+'<br>WhatsApp: '+(p.phone||'-')+'</div>').join(''):'<p>Nenhum pagamento.</p>';
}
async function statusChange(id,status){const r=await fetch('/api/admin/campaign/'+id+'/status',{method:'PATCH',headers:auth(),body:JSON.stringify({status})});if(r.ok)refresh();}
form.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(form));delete o.image; if(image.files[0]){const fd=new FormData();fd.append('image',image.files[0]);const ur=await fetch('/api/admin/upload',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});const ud=await ur.json();if(!ur.ok){msg.textContent=ud.error||'Erro no upload';return;}o.imageUrl=ud.url;}const r=await fetch('/api/admin/campaigns',{method:'POST',headers:auth(),body:JSON.stringify(o)});const d=await r.json();msg.textContent=r.ok?'Campanha criada com sucesso!':d.error;if(r.ok){form.reset();refresh();}};
saveResults.onclick=async()=>{
  const body={
    date:resultDate.value,
    time:resultTime.value,
    results:[
      result1.value,
      result2.value,
      result3.value,
      result4.value,
      result5.value
    ].filter(Boolean)
  };

  resultMessage.textContent='Salvando resultados...';

  const r=await fetch('/api/admin/results',{
    method:'POST',
    headers:{...auth(),'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });

  const d=await r.json();
  resultMessage.style.whiteSpace='pre-line';

if(r.ok){
  resultMessage.textContent=d.winners.length
    ? '🏆 GANHADORES\n\n'+d.winners.map(w=>
  w.position+'º - '+w.campaign+'\n'+w.name+' - '+w.phone+'\n'+
(w.type==='centena'?'Centena: '+String(w.winningNumber).padStart(3,'0'):
 w.type==='dezena'?'Dezena: '+String(w.winningNumber).padStart(2,'0'):
 w.type==='grupo'?'Grupo: '+String(w.winningNumber).padStart(2,'0'):
 'Número: '+w.winningNumber)+'\nPrêmio: R$ '+Number(w.prizeAmount||0).toFixed(2).replace('.',',')
).join('\n\n')
    : 'Resultado salvo. Nenhum ganhador.';
}else{
  resultMessage.textContent=d.error||'Erro ao salvar resultado';
}
};



manualSaleForm.onsubmit=async e=>{
  e.preventDefault();

  const body={
    campaignId:manualCampaign.value,
    name:manualName.value.trim(),
    phone:manualPhone.value.trim(),
    number:manualNumber.value,
    paymentMethod:manualPayment.value
  };

  const r=await fetch('/api/admin/manual-sale',{
    method:'POST',
    headers:auth(),
    body:JSON.stringify(body)
  });

  const d=await r.json();

  manualMsg.textContent=r.ok?'Venda registrada como PAGA / VENDIDA':d.error;

  if(r.ok){
const rifa=manualCampaign.options[manualCampaign.selectedIndex].text;
const tipo=d.type||'numeros';
const rotulo=tipo==='centena'?'Centena':tipo==='dezena'?'Dezena':tipo==='grupo'?'Grupo':'Número';
const casas=tipo==='centena'?3:(tipo==='dezena'||tipo==='grupo'?2:0);
const numeroExibido=casas?String(d.number).padStart(casas,'0'):String(d.number);
const dataExibida=d.date?d.date.split('-').reverse().join('/'):'';
const bilhete=window.open('','_blank','width=400,height=600');
bilhete.document.write(`
<style>
@page{size:58mm 80mm;margin:0}
body{font-family:Arial;width:58mm;margin:0;padding:3mm;font-size:18px}
h2{text-align:center}
hr{border:0;border-top:1px dashed
#000}
</style>
<h2>RIFA CERTA</h2>
<hr>
<b>Rifa:</b> ${rifa}<br>
<b>Cliente:</b> ${body.name}<br>
<b>WhatsApp:</b> ${body.phone}<br>
<b>Data:</b> ${dataExibida}<br>
<b>Horário:</b> ${d.time}<br>
<b>${rotulo}:</b> ${numeroExibido}<br>
<b>Pagamento:</b> ${body.paymentMethod}<br>
<b>Status:</b> PAGO / VENDIDO
<hr>
`);
bilhete.document.close();
bilhete.print();
    manualSaleForm.reset();
    refresh();
  }
};
check();
</script></body></html>
