<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprovante - Rifa Certa</title>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#071711;
      color:white;
    }

    .wrap{
      max-width:600px;
      margin:30px auto;
      padding:20px;
    }

    .card{
      background:#10241c;
      border:1px solid #315342;
      border-radius:18px;
      padding:24px;
    }

    h1{
      margin-top:0;
    }

    .ok{
      color:#8df13c;
      font-weight:bold;
      font-size:20px;
      margin-bottom:20px;
    }

    .linha{
      margin:10px 0;
      font-size:18px;
    }

    .numeros{
      margin-top:8px;
      font-weight:bold;
      color:#8df13c;
    }

    button{
      width:100%;
      margin-top:20px;
      padding:14px;
      border:0;
      border-radius:12px;
      font-weight:bold;
      font-size:16px;
      cursor:pointer;
      background:linear-gradient(90deg,#20d86b,#9cf11f);
      color:#102010;
    }

    .erro{
      color:#ff6b6b;
      font-weight:bold;
    }
@media print{
  @page{
    size:48mm 100mm;
    margin:2mm;
  }

  body{
    background:white;
    color:black;
    font-size:10px;
  }

  .wrap{
    width:44mm;
    margin:0;
    padding:0;
  }

  .card{
    background:white;
    color:black;
    border:0;
    padding:0;
  }

  h1{
    font-size:15px;
    margin:0 0 5px 0;
  }

  button{
    display:none !important;
  }
 .numeros{
  color:#000 !important;
  opacity:1 !important;
  font-weight:bold !important;
}
}
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">
    <h1>🍀 Rifa Certa</h1>
    <div id="conteudo">Carregando comprovante...</div>
  </div>
</div>

<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let carregando=false,encerrado=false;
async function carregarComprovante(){
  if(carregando||encerrado) return;
  carregando=true;
  const conteudo=document.getElementById('conteudo');
  try{
    const id=new URLSearchParams(location.search).get('id');
    if(!id) throw new Error('Comprovante inválido.');
    const r=await fetch('/api/ticket/'+encodeURIComponent(id),{cache:'no-store'});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Comprovante não encontrado.');
    const paid=d.status==='processed'&&(d.provider==='mercadopago'?d.fulfillmentStatus==='sold':d.fulfillmentStatus!=='review_required');
    const demo=d.provider==='demo';
    const terminal=['canceled','expired','failed','refunded'].includes(d.status);
    const type=d.campaign?.type;
    const widths={grupo:2,dezena:2,centena:3,milhar:4};
    const mod={dezena:100,centena:1000,milhar:10000}[type];
    const numbers=(d.numbers||[]).map(n=>String(mod?Number(n)%mod:n).padStart(widths[type]||0,'0')).join(', ');
    const quantity=(d.numbers||[]).length;
    const typePlural={grupo:'grupos',dezena:'dezenas',centena:'centenas',milhar:'milhares',numeros:'números'}[type]||'números';
    const status=d.fulfillmentStatus==='review_required'?'Pagamento recebido — aguarde conferência do responsável':
      paid?(demo?'SIMULAÇÃO — SEM PAGAMENTO REAL':'PAGO / VENDIDO'):
      terminal?'PEDIDO ENCERRADO — BILHETE NÃO VÁLIDO':'AGUARDANDO PAGAMENTO';
    const date=d.campaign?.date;
    const dateText=/^\d{4}-\d{2}-\d{2}$/.test(date||'')?date.split('-').reverse().join('/'):date||'Não informado';
    conteudo.innerHTML=`
      <div class="${paid?'ok':'erro'}">${esc(status)}</div>
      <div class="linha"><strong>Campanha:</strong> ${esc(d.campaign?.title||'-')}</div>
      <div class="linha"><strong>Tipo:</strong> ${esc(type||'-')}</div>
      <div class="linha"><strong>Sorteio:</strong> ${esc(dateText)} às ${esc(d.campaign?.time||'Não informado')}</div>
      <div class="linha"><strong>Cliente:</strong> ${esc(d.name||'-')}</div>
      <div class="linha"><strong>WhatsApp:</strong> ${esc(d.phone||'-')}</div>
      <div class="linha"><strong>Quantidade:</strong> ${quantity} ${esc(quantity===1?(type==='numeros'?'número':type):typePlural)}</div>
      <div class="linha"><strong>${paid?'Números comprados':'Números do pedido'}:</strong><div class="numeros">${esc(numbers)}</div></div>
      <div class="linha"><strong>Valor:</strong> R$ ${Number(d.amount||0).toFixed(2).replace('.',',')}</div>
      <button onclick="compartilharComprovante()">Compartilhar comprovante</button>
      <button onclick="window.print()">Imprimir / Salvar comprovante</button>
      <p id="aviso" role="status"></p>`;
    encerrado=paid||terminal||d.fulfillmentStatus==='review_required';
  }catch(err){
    conteudo.textContent=err.message||'Falha de conexão. Tentando novamente...';
  }finally{carregando=false;}
}
async function compartilharComprovante(){
  try{
    if(navigator.share){await navigator.share({title:'Comprovante Rifa Certa',text:'Meu comprovante da Rifa Certa',url:location.href});}
    else{
      window.open('https://wa.me/?text='+encodeURIComponent('Meu comprovante da Rifa Certa: '+location.href),'_blank','noopener');
    }
  }catch(err){if(err.name!=='AbortError') document.getElementById('aviso').textContent='Não foi possível compartilhar. Copie o endereço desta página.';}
}
carregarComprovante();
setInterval(carregarComprovante,5000);
</script>

</body>
</html>
