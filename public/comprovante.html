<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprovante - Rifa Certa</title>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#071711;
      color:white;
    }

    .wrap{
      max-width:600px;
      margin:30px auto;
      padding:20px;
    }

    .card{
      background:#10241c;
      border:1px solid #315342;
      border-radius:18px;
      padding:24px;
    }

    h1{
      margin-top:0;
    }

    .ok{
      color:#8df13c;
      font-weight:bold;
      font-size:20px;
      margin-bottom:20px;
    }

    .linha{
      margin:10px 0;
      font-size:18px;
    }

    .numeros{
      margin-top:8px;
      font-weight:bold;
      color:#8df13c;
    }

    button{
      width:100%;
      margin-top:20px;
      padding:14px;
      border:0;
      border-radius:12px;
      font-weight:bold;
      font-size:16px;
      cursor:pointer;
      background:linear-gradient(90deg,#20d86b,#9cf11f);
      color:#102010;
    }

    .erro{
      color:#ff6b6b;
      font-weight:bold;
    }
@media print{
  @page{
    size:48mm 100mm;
    margin:2mm;
  }

  body{
    background:white;
    color:black;
    font-size:10px;
  }

  .wrap{
    width:44mm;
    margin:0;
    padding:0;
  }

  .card{
    background:white;
    color:black;
    border:0;
    padding:0;
  }

  h1{
    font-size:15px;
    margin:0 0 5px 0;
  }

  button{
    display:none !important;
  }
 .numeros{
  color:#000 !important;
  opacity:1 !important;
  font-weight:bold !important;
}
}
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">
    <h1>🍀 Rifa Certa</h1>
    <div id="conteudo">Carregando comprovante...</div>
  </div>
</div>

<script>
async function carregarComprovante(){
  const id=new URLSearchParams(location.search).get('id');
  const conteudo=document.getElementById('conteudo');

  if(!id){
    conteudo.innerHTML='<div class="erro">Comprovante inválido.</div>';
    return;
  }

  const r=await fetch('/api/ticket/'+encodeURIComponent(id));
  const d=await r.json();

  if(!r.ok){
    conteudo.innerHTML='<div class="erro">'+(d.error||'Comprovante não encontrado.')+'</div>';
    return;
  }

  const status=d.status==='processed' ? 'PAGO / VENDIDO' : d.status;

  conteudo.innerHTML=`
   <div class="${d.status==='processed'?'ok':'erro'}">
${d.status==='processed'?'✅ Pagamento confirmado':'⏳ Pagamento ainda não confirmado'}
</div>

    <div class="linha"><strong>Campanha:</strong> ${d.campaign?.title||'-'}</div>
    <div class="linha"><strong>Tipo:</strong> ${d.campaign?.type||'-'}</div>
    <div class="linha"><strong>Cliente:</strong> ${d.name||'-'}</div>
    <div class="linha"><strong>WhatsApp:</strong> ${d.phone||'-'}</div>

    <div class="linha">
      <strong>Números comprados:</strong>
      <div class="numeros">${(d.numbers||[]).join(', ')}</div>
    </div>

    <div class="linha"><strong>Valor:</strong> R$ ${Number(d.amount||0).toFixed(2).replace('.',',')}</div>
    <div class="linha"><strong>Status:</strong> ${status}</div>
    <button onclick="compartilharComprovante()">Compartilhar comprovante</button>
    <button onclick="window.print()">Imprimir / Salvar comprovante</button>
  `;
}
async function compartilharComprovante(){
  const url=location.href;

  if(navigator.share){
    await navigator.share({
      title:'Comprovante Rifa Certa',
      text:'Meu comprovante da Rifa Certa',
      url
    });
  }else{
    await navigator.clipboard.writeText(url);
    alert('Link do comprovante copiado!');
  }
}
carregarComprovante();
</script>

</body>
</html>
