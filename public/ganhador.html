<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ganhador - Rifa Certa</title><link rel="stylesheet" href="/style.css"><style>
.winner-wrap{max-width:600px;margin:30px auto}.winner-proof{text-align:center}.winner-proof h1{font-size:34px}.winner-value{display:inline-block;background:#ffc52e;color:#181400;padding:8px 16px;border-radius:999px;font-size:25px;font-weight:900}.winner-number{font-size:30px;color:#b6f43e;font-weight:900}.winner-status{font-weight:900;font-size:20px;margin:18px 0}.winner-status.paid{color:#8df13c}.winner-status.pending{color:#ffd66b}.winner-proof .linha{text-align:left;margin:12px 0;font-size:18px}.winner-proof button{margin-top:12px}
@media print{header,.winner-proof button{display:none}.winner-wrap{margin:0}.winner-proof{border:0;background:white;color:black}.winner-number,.winner-status{color:black!important}}
</style></head><body><header><div class="brand">🍀 <strong>Rifa Certa</strong></div></header><main class="winner-wrap"><section class="panel winner-proof"><h1>🏆 Ganhador</h1><div id="winnerContent">Carregando...</div></section></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const formatNumber=(n,type)=>{const mod={dezena:100,centena:1000,milhar:10000}[type];return String(mod?Number(n)%mod:n).padStart({grupo:2,dezena:2,centena:3,milhar:4}[type]||0,'0');};
async function loadWinner(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Comprovante inválido.');const r=await fetch('/api/winner/'+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error);const date=/^\d{4}-\d{2}-\d{2}$/.test(d.date||'')?d.date.split('-').reverse().join('/'):d.date||'-';const label=d.type==='grupo'?'Grupo':d.type==='centena'?'Centena':d.type==='dezena'?'Dezena':'Número';winnerContent.innerHTML=`<div class="winner-status ${d.prizePaid?'paid':'pending'}">${d.prizePaid?'PRÊMIO PAGO':'PRÊMIO AGUARDANDO PAGAMENTO'}</div><div class="linha"><strong>Campanha:</strong> ${esc(d.campaign)}</div><div class="linha"><strong>Sorteio:</strong> ${esc(date)} às ${esc(d.time)}</div><div class="linha"><strong>Vencedor:</strong> ${esc(d.name||'-')}</div><div class="linha"><strong>${label} vencedor:</strong></div><div class="winner-number">${esc(formatNumber(d.winningNumber,d.type))}</div><p class="winner-value">${money(d.prizeAmount||0)}</p><button class="primary" onclick="shareWinner()">Compartilhar ganhador</button><button class="secondary" onclick="window.print()">Imprimir / Salvar</button>`;}catch(e){winnerContent.textContent=e.message||'Não foi possível abrir o comprovante.';}}
async function shareWinner(){try{if(navigator.share)await navigator.share({title:'Ganhador da Rifa Certa',text:'Confira o ganhador da Rifa Certa',url:location.href});else window.open('https://wa.me/?text='+encodeURIComponent('Confira o ganhador da Rifa Certa: '+location.href),'_blank','noopener');}catch(e){}}
loadWinner();
</script></body></html>
