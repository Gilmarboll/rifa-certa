<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rifa Certa MVP</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand">🍀 <strong>Rifa Certa</strong></div><div class="safe">🔒 Ambiente seguro</div></header>
<main>
<section class="hero"><div><span class="badge">DEMO FUNCIONAL</span><h1 id="title">Rifa Certa</h1><p id="prize">Carregando...</p><div class="meta"><span id="price"></span><span id="progress"></span></div></div><div class="prize-card">🏍️</div></section>
<section class="layout">
<div class="panel"><div class="panel-head"><div><h2>Escolha seus números</h2><p>.Disponível em verde, reservado em laranja, vendido em vermelho, selecionado em amarelo.</p></div><button id="randomBtn" class="secondary">Escolher aleatórios</button></div><div id="grid" class="grid"></div></div>
<aside class="cart"><h2>Seu carrinho</h2><div id="selectedList" class="selected-list">Nenhum número escolhido.</div><div class="total-row"><span>Total</span><strong id="total">R$ 0,00</strong></div><button id="reserveBtn" class="primary">Continuar para pagamento</button><div id="msg" class="msg"></div></aside>
</section></main><script src="/app.js"></script></body></html>
