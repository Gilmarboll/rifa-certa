<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rifa Certa MVP</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand">🍀 <strong>Rifa Certa</strong></div><div class="safe">🔒 Ambiente seguro</div></header>
<main>
<section class="hero"><div><span class="badge">COMPRA SEGURA</span><h1 id="title">Rifa Certa</h1><p id="prize">Carregando...</p><div class="meta"><span id="price"></span><span id="progress"></span></div></div><div class="prize-card">🏍️</div></section>
<section class="layout">
<div class="panel"><div class="panel-head"><div><h2>Escolha seus números</h2><p>.<span style="color:#22c55e">●</span> Disponível &nbsp;&nbsp;
<span style="color:#f59e0b">●</span> Reservado &nbsp;&nbsp;
<span style="color:#ef4444">●</span> Vendido &nbsp;&nbsp;
<span style="color:#eab308">●</span> Selecionado</p></div><button id="randomBtn" class="secondary">Escolher aleatórios</button></div><div id="grid" class="grid"></div></div>
<aside class="cart"><h2>Seu carrinho</h2><div id="selectedList" class="selected-list">Nenhum número escolhido.</div><div class="total-row"><span>Total</span><strong id="total">R$ 0,00</strong></div><button id="reserveBtn" class="primary">Continuar para pagamento</button><div id="msg" class="msg"></div><button id="lastReceiptBtn" class="secondary" style="display:none;margin-top:10px">Ver último comprovante</button></aside>
</section>
<section class="support-card"><h2>Precisa de ajuda?</h2><p>Fale diretamente com o suporte da Rifa Certa.</p><a id="supportLink" class="primary support-link" target="_blank" rel="noopener">💬 Falar no WhatsApp</a></section>
</main><script src="/app.js"></script><script>fetch('/api/public-config').then(r=>r.json()).then(c=>{const link=document.getElementById('supportLink');if(c.supportWhatsApp) link.href='https://wa.me/'+c.supportWhatsApp+'?text='+encodeURIComponent('Olá, preciso de ajuda com a Rifa Certa.');}).catch(()=>{});</script></body></html>
